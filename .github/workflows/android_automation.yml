name: Redroid Docker Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-redroid-selfhosted:
    runs-on: self-hosted  # Must point to your local machine or VPS runner where binder is installed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Redroid Container
        run: |
          # Ensures kernel modules are loaded on your host machine
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          sudo modprobe ashmem_linux || true

          docker run -itd --rm --privileged \
            --pull always \
            -p 5555:5555 \
            redroid/redroid:12.0.0_64only-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 \
            androidboot.redroid_fps=30
          
          sleep 15
          adb connect localhost:5555
          adb devices

      - name: Start Appium Server & Run
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium &
          sleep 5
          python scripts/run_workflow.py